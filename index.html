<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark">
<title>Todo Calendar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{color-scheme:dark;--bg:#101113;--panel:#191b1e;--cell:#202227;--border:#303238;--muted:#858b91;--text:#f0f1f2;--mint:#a8e5c7}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--mint);outline-offset:2px}.shell{max-width:1200px;margin:auto;padding:20px}.eyebrow{font-size:10px;letter-spacing:.22em;color:var(--mint);font-weight:800;margin-bottom:7px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.title{font-size:25px;letter-spacing:-.055em;font-weight:800;margin:0}.subtitle{font-size:11px;color:var(--muted);margin-top:5px}.todaybtn{border:1px solid var(--border);border-radius:8px;background:var(--panel);color:#d2d5d8;padding:8px 12px;font-size:11px;font-weight:700}.layout{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(245px,0.85fr);gap:12px;min-height:515px}.card{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:17px;min-width:0}.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:19px}.month-title{font-size:16px;letter-spacing:-.04em;font-weight:800}.small-note{font-size:10px;color:var(--muted)}.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekdays{margin-bottom:7px}.weekdays div{text-align:center;color:#8c9298;font-size:9px;font-weight:800;padding-bottom:5px}.weekdays div:first-child{color:#8c9298}.day,.blank{height:75px;min-width:0}.day{background:var(--cell);border:1px solid var(--border);border-radius:7px;padding:7px 6px;display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;color:var(--text);text-align:left;transition:background .15s,border-color .15s}.day:hover{border-color:#7b9c8b}.day.selected{border-color:var(--mint);background:#26342e}.day.today .number{background:var(--mint);color:#172820}.day.selected:not(.today) .number{color:var(--mint)}.day.flagged{border-color:#b65359;background:#38272b}.day.flagged .number{color:#ff9ba0}.day.flagged.today .number{background:#d45e65;color:#fff}.day.flagged.selected{box-shadow:inset 0 0 0 1px #e07378}.flagbtn{border:1px solid #684147;background:#2a2023;color:#e58d93;border-radius:8px;font-size:11px;font-weight:700;padding:7px 10px;white-space:nowrap}.flagbtn.active{background:#ac434d;border-color:#d26c74;color:#fff}.date-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}.date-actions .day-meta{margin-top:0}.side-heading{min-height:26px}.number{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:800}.day-bottom{display:flex;align-items:end;justify-content:space-between;gap:3px}.day-count{font-size:9px;color:#9aa7a0}.dots{display:flex;gap:4px;flex-wrap:wrap}.dot{background:#91bba3;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1px rgba(145,187,163,.12)}.dot.done{background:#52675d}.footer{margin-top:14px;font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:9px}.footer button{color:#a0baa9;border:0;background:transparent;font-size:10px;padding:0}.side{display:flex;flex-direction:column;min-height:0}.side-heading{display:flex;align-items:center;justify-content:space-between;gap:8px}.side-title{font-size:18px;letter-spacing:-.04em;font-weight:800}.day-meta{font-size:11px;color:var(--mint);margin-top:7px}.progress{font-size:10px;color:#a8b5ac;background:#242b28;border-radius:999px;padding:5px 9px;white-space:nowrap}.divider{height:1px;background:var(--border);margin:15px 0}.tasklist{flex:1;overflow:auto;min-height:0;max-height:345px;padding-right:4px;scrollbar-color:#4c5450 transparent;scrollbar-width:thin}.task{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid #292d30}.check{appearance:none;flex:none;width:16px;height:16px;margin:1px 0 0;border:1.5px solid #747f7a;border-radius:4px;cursor:pointer;display:grid;place-items:center}.check:checked{background:var(--mint);border-color:var(--mint)}.check:checked:after{content:'✓';color:#13281d;font-size:12px;font-weight:900}.taskname{flex:1;min-width:0;overflow-wrap:anywhere;font-size:15px;line-height:1.5}.task.done .taskname{text-decoration:line-through;color:#777f7b}.delete{border:0;background:transparent;color:#7d8581;padding:0 3px;font-size:17px;line-height:1}.delete:hover{color:#ed9da3}.empty{padding:55px 4px;text-align:center;font-size:12px;color:#7f8983;line-height:1.7}.addform{display:flex;gap:7px;align-items:center;border:1px solid #3a443e;border-radius:9px;padding:6px 7px 6px 11px;margin-top:15px;background:#202622}.addform input{min-width:0;flex:1;border:0;outline:none;background:transparent;color:var(--text);font-size:12px;padding:7px 0}.addform input::placeholder{color:#77817b}.addform button{border:0;background:var(--mint);color:#12251b;border-radius:6px;font-size:18px;font-weight:700;width:28px;height:28px}.hint{margin-top:10px;color:#7d8880;font-size:10px}.toast{position:fixed;bottom:12px;right:12px;padding:10px;border:1px solid #4d5c52;background:#26392d;color:#d9f5e5;border-radius:9px;font-size:11px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
@media(max-width:720px){.shell{padding:13px}.layout{grid-template-columns:1fr;min-height:0}.card{padding:13px}.day,.blank{height:64px}.tasklist{max-height:230px}.side{min-height:300px}.title{font-size:22px}.cal-head{margin-bottom:13px}}@media(min-width:721px) and (max-width:890px){.layout{grid-template-columns:minmax(0,1.9fr) minmax(215px,0.9fr)}.card{padding:12px}.day,.blank{height:68px}}
</style>
</head>
<body>
<main class="shell">
  <header class="topbar"><div><h1 class="title">Todo Calendar<span style="color:var(--mint)">.</span></h1></div><button class="todaybtn" id="todayBtn" type="button">Today</button></header>
  <div class="layout">
    <section class="card" aria-label="4주 캘린더"><div class="cal-head"><div class="month-title" id="monthTitle"></div></div><div class="weekdays"><div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div></div><div class="days" id="days"></div></section>
    <section class="card side" aria-label="선택한 날짜의 할 일"><div class="side-heading"><div class="side-title">To-do list</div><span class="progress" id="progress">0 / 0</span></div><div class="date-actions"><div class="day-meta" id="selectedDate"></div><button class="flagbtn" id="flagBtn" type="button" aria-pressed="false" title="선택한 날짜 빨간색 표시">● Red</button></div><div class="divider"></div><div class="tasklist" id="tasklist"></div><form class="addform" id="addForm"><input id="taskInput" type="text" placeholder="+ Add a task" maxlength="140" autocomplete="off" aria-label="할 일 추가"><button type="submit" aria-label="추가">+</button></form></section>
  </div>
</main><div id="toast" class="toast" role="status"></div>
<script>
(()=>{'use strict';
const STORE='minimal-todomate-widget-v1', FLAG_STORE='minimal-todomate-widget-red-dates-v1';let db={},flags={};try{const v=JSON.parse(localStorage.getItem(FLAG_STORE)||'{}');if(v&&typeof v==='object'&&!Array.isArray(v))flags=v}catch(e){}
try{const v=JSON.parse(localStorage.getItem(STORE)||'{}');if(v&&typeof v==='object'&&!Array.isArray(v))db=v}catch(e){}
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>{const d=new Date();d.setHours(12,0,0,0);return d};const start=today();let selected=key(start);const tasks=k=>Array.isArray(db[k])?db[k]:[];
const format=new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric'});
function newId(){return globalThis.crypto?.randomUUID?.()||`${Date.now()}_${Math.random()}`}
let toastTimer;function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2000)}
function save(){try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){toast('Could not save to this browser')}}function saveFlags(){try{localStorage.setItem(FLAG_STORE,JSON.stringify(flags))}catch(e){toast('Could not save date colors')}}
function showDate(k){selected=k;render()}
function render(){const beginning=today();const finish=new Date(beginning.getFullYear(),beginning.getMonth(),beginning.getDate()+27,12);$('monthTitle').textContent=`${format.format(beginning)} – ${format.format(finish)}, ${finish.getFullYear()}`;
const grid=$('days');grid.replaceChildren();for(let i=0;i<beginning.getDay();i++){const el=document.createElement('div');el.className='blank';grid.append(el)}
for(let i=0;i<28;i++){const d=new Date(beginning.getFullYear(),beginning.getMonth(),beginning.getDate()+i,12),k=key(d),list=tasks(k);const b=document.createElement('button');b.type='button';b.className='day'+(k===selected?' selected':'')+(i===0?' today':'')+(flags[k]?' flagged':'');b.setAttribute('aria-label',`${k}: ${list.length} tasks`);b.setAttribute('aria-pressed',k===selected?'true':'false');b.onclick=()=>showDate(k);const number=document.createElement('span');number.className='number';number.textContent=d.getDate();const bottom=document.createElement('div');bottom.className='day-bottom';const dots=document.createElement('span');dots.className='dots';for(const t of list.slice(0,4)){const dot=document.createElement('span');dot.className='dot'+(t.done?' done':'');dots.append(dot)}const cnt=document.createElement('span');cnt.className='day-count';if(list.length)cnt.textContent=`${list.filter(t=>t.done).length}/${list.length}`;bottom.append(dots,cnt);b.append(number,bottom);grid.append(b)}
const parts=selected.split('-').map(Number);const date=new Date(parts[0],parts[1]-1,parts[2],12);$('selectedDate').textContent=new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}).format(date);const flagBtn=$('flagBtn');flagBtn.classList.toggle('active',!!flags[selected]);flagBtn.setAttribute('aria-pressed',flags[selected]?'true':'false');flagBtn.textContent=flags[selected]?'● Red ✓':'● Red';
const list=tasks(selected),done=list.filter(t=>t.done).length;$('progress').textContent=`${done} / ${list.length} done`;const root=$('tasklist');root.replaceChildren();if(!list.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='No tasks';root.append(empty)}
for(const item of list){const line=document.createElement('div');line.className='task'+(item.done?' done':'');const check=document.createElement('input');check.type='checkbox';check.className='check';check.checked=!!item.done;check.setAttribute('aria-label',`${item.text} complete`);check.onchange=()=>{item.done=check.checked;save();render()};const name=document.createElement('div');name.className='taskname';name.textContent=item.text;const del=document.createElement('button');del.type='button';del.className='delete';del.textContent='×';del.setAttribute('aria-label',`${item.text} delete`);del.onclick=()=>{db[selected]=tasks(selected).filter(t=>t!==item);if(!db[selected].length)delete db[selected];save();render()};line.append(check,name,del);root.append(line)}
}
$('addForm').onsubmit=e=>{e.preventDefault();const input=$('taskInput'),value=input.value.trim();if(!value)return;if(!Array.isArray(db[selected]))db[selected]=[];db[selected].push({id:newId(),text:value,category:'other',done:false});input.value='';save();render();input.focus()};
$('todayBtn').onclick=()=>showDate(key(today()));$('flagBtn').onclick=()=>{if(flags[selected])delete flags[selected];else flags[selected]=true;saveFlags();render()};

render();
})();
</script></body></html>
