<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark">
<title>Todo Calendar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#101113;--panel:#191b1e;--panel2:#202227;--border:#303238;--muted:#82868f;--text:#f0f1f2;--mint:#a8e5c7}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--mint);outline-offset:2px}.shell{max-width:1200px;margin:auto;padding:24px 24px 28px}.eyebrow{font-size:10px;letter-spacing:.24em;color:var(--mint);font-weight:800;margin-bottom:8px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:23px}.title{font-size:26px;letter-spacing:-.055em;font-weight:800;margin:0}.subtitle{font-size:11px;color:var(--muted);margin-top:7px}.todaybtn{border:1px solid var(--border);border-radius:9px;background:var(--panel);color:#d2d5d8;padding:9px 12px;font-size:11px;font-weight:700}.calendar-card{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:19px}.cal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.month-title{font-size:18px;letter-spacing:-.045em;font-weight:800}.small-note{font-size:10px;color:#858b90}.calendar-scroll{overflow-x:auto;padding-bottom:2px;scrollbar-color:#45494d transparent;scrollbar-width:thin}.calendar-grid{min-width:740px}.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.weekdays>div{text-align:center;color:#858991;font-size:10px;font-weight:800;padding:0 0 10px}.weekdays>div:first-child{color:#df8e95}.day-blank{min-height:154px}.day{min-width:0;min-height:154px;background:#202227;border:1px solid #303338;border-radius:10px;padding:9px 7px 7px;display:flex;flex-direction:column;gap:7px;transition:border-color .15s,background .15s}.day:hover{border-color:#4c5650}.day.today{border-color:#739982;background:#222d28}.day-head{display:flex;align-items:center;justify-content:space-between;gap:2px}.date{display:grid;place-items:center;width:24px;height:24px;flex:none;border-radius:50%;font-size:11px;font-weight:800;color:#d8dcde}.day.today .date{background:var(--mint);color:#11221a}.day.sunday:not(.today) .date{color:#ef999e}.month-mini{font-size:9px;color:#80868c;white-space:nowrap}.task-count{font-size:9px;color:#859d8c;white-space:nowrap}.day-tasks{display:flex;flex-direction:column;gap:5px;flex:1;min-height:49px}.day-task{display:flex;align-items:flex-start;gap:5px;min-width:0;border-radius:5px}.day-check{appearance:none;flex:none;width:12px;height:12px;margin:2px 0 0;border:1.4px solid #777f82;border-radius:3px;background:transparent;display:grid;place-items:center;cursor:pointer}.day-check:checked{background:var(--mint);border-color:var(--mint)}.day-check:checked:after{content:'✓';font-size:9px;font-weight:900;color:#173025}.day-task-text{flex:1;min-width:0;color:#d9dcdd;font-size:10px;line-height:1.4;overflow-wrap:anywhere}.day-task.done .day-task-text{color:#7b8580;text-decoration:line-through}.remove{flex:none;background:none;border:0;color:#70777b;font-size:13px;line-height:1;padding:0 1px;opacity:0}.day-task:hover .remove,.remove:focus-visible{opacity:1}.remove:hover{color:#f3a0a7}.add-row{display:flex;align-items:center;gap:3px;margin-top:auto;padding-top:3px;border-top:1px solid #34383c}.inline-input{width:100%;min-width:0;border:0;background:transparent;color:#f0f1f2;font-size:10px;padding:5px 2px;outline:none}.inline-input::placeholder{color:#71777e}.inline-input:focus{outline:none}.add-btn{background:transparent;border:0;color:var(--mint);font-size:17px;line-height:1;padding:0 2px}.add-btn:hover{color:white}.foot{display:flex;justify-content:space-between;gap:12px;margin-top:15px;padding-top:14px;border-top:1px solid var(--border)}.foot small{font-size:10px;color:var(--muted)}.foot button{border:0;background:transparent;color:#a0baa9;font-size:10px;padding:0}.foot button:hover{text-decoration:underline}.toast{position:fixed;bottom:16px;right:16px;border:1px solid #4d5c52;border-radius:9px;background:#26392d;color:#d9f5e5;padding:10px 13px;font-size:11px;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:800px){.shell{padding:16px 11px}.calendar-card{padding:14px}.title{font-size:23px}.topbar{margin-bottom:16px}.day{min-height:148px}}@media(hover:none){.remove{opacity:1}}
</style>
</head>
<body><main class="shell"><div class="topbar"><div><div class="eyebrow">MY DAILY PLANNER</div><h1 class="title">Todo Calendar<span style="color:var(--mint)">.</span></h1><div class="subtitle">Next 4 weeks, starting today.</div></div><button type="button" class="todaybtn" id="todayBtn">Today</button></div>
<section class="calendar-card" aria-label="오늘부터 4주간 할 일 캘린더"><div class="cal-head"><div class="month-title" id="monthTitle"></div><div class="small-note">Type directly into each date</div></div><div class="calendar-scroll"><div class="calendar-grid"><div class="weekdays"><div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div></div><div class="days" id="days"></div></div></div><div class="foot"><small>각 날짜에 할 일을 입력하고 Enter를 누르세요. 체크하면 완료 처리됩니다.</small><button id="exportBtn" type="button">Export backup ↗</button></div></section></main><div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';
const STORE='minimal-todomate-widget-v1';let db={};
try{const value=JSON.parse(localStorage.getItem(STORE)||'{}');if(value&&typeof value==='object'&&!Array.isArray(value))db=value}catch(e){}
const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dayTasks=d=>Array.isArray(db[key(d)])?db[key(d)]:[];const dateBase=()=>{const d=new Date();d.setHours(12,0,0,0);return d};
function toast(s){const el=$('toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2400)}
function save(){try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){toast('저장 공간을 사용할 수 없어요')}}
function taskId(){return globalThis.crypto?.randomUUID?.()||`${Date.now()}_${Math.random()}`}
function render(){const start=dateBase(),end=new Date(start.getFullYear(),start.getMonth(),start.getDate()+27,12);const formatter=new Intl.DateTimeFormat('en-US',{month:'short'});$('monthTitle').textContent=`${formatter.format(start)} ${start.getDate()} – ${formatter.format(end)} ${end.getDate()}, ${end.getFullYear()}`;const root=$('days');root.replaceChildren();for(let i=0;i<start.getDay();i++){const blank=document.createElement('span');blank.className='day-blank';blank.setAttribute('aria-hidden','true');root.append(blank)}
for(let i=0;i<28;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i,12);const k=key(d),tasks=dayTasks(d),done=tasks.filter(t=>t.done).length;const card=document.createElement('div');card.className='day'+(i===0?' today':'')+(d.getDay()===0?' sunday':'');card.setAttribute('aria-label',k);const head=document.createElement('div');head.className='day-head';const dt=document.createElement('span');dt.className='date';dt.textContent=d.getDate();dt.title=k;const cnt=document.createElement('span');cnt.className='task-count';cnt.textContent=tasks.length?`${done}/${tasks.length}`:'';head.append(dt,cnt);card.append(head);
const list=document.createElement('div');list.className='day-tasks';for(const t of tasks){const line=document.createElement('div');line.className='day-task'+(t.done?' done':'');const checkbox=document.createElement('input');checkbox.className='day-check';checkbox.type='checkbox';checkbox.checked=!!t.done;checkbox.setAttribute('aria-label',`${t.text} 완료 체크`);checkbox.addEventListener('change',()=>{t.done=checkbox.checked;save();render()});const text=document.createElement('span');text.className='day-task-text';text.textContent=t.text;const del=document.createElement('button');del.className='remove';del.type='button';del.textContent='×';del.title='삭제';del.setAttribute('aria-label',`${t.text} 삭제`);del.addEventListener('click',()=>{db[k]=dayTasks(d).filter(x=>x.id!==t.id);if(!db[k].length)delete db[k];save();render()});line.append(checkbox,text,del);list.append(line)}card.append(list);
const form=document.createElement('form');form.className='add-row';const inp=document.createElement('input');inp.className='inline-input';inp.type='text';inp.maxLength=140;inp.placeholder='+ Add todo';inp.autocomplete='off';inp.setAttribute('aria-label',`${k} 할 일 입력`);const add=document.createElement('button');add.className='add-btn';add.type='submit';add.textContent='+';add.setAttribute('aria-label',`${k} 할 일 추가`);form.append(inp,add);form.addEventListener('submit',e=>{e.preventDefault();const value=inp.value.trim();if(!value)return;if(!Array.isArray(db[k]))db[k]=[];db[k].push({id:taskId(),text:value,category:'other',done:false});save();render();const next=document.querySelector(`[data-day="${k}"] input.inline-input`);if(next)next.focus()});card.dataset.day=k;card.append(form);root.append(card)}}
$('todayBtn').addEventListener('click',()=>{render();window.scrollTo({top:0,behavior:'smooth'})});$('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='todo-calendar-backup.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('백업 파일을 내보냈어요')});render();
})();
</script></body></html>
